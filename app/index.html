<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Pixelport</title>
    <link rel="icon" href="assets/icon.png" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="library.js"></script>
  </head>
  <body>
    <a class="skip" href="#library">Skip to games</a>
    <aside id="sidebar" class="sidebar" aria-label="Arcade navigation">
      <button class="brand" data-nav="Discover" aria-label="Pixelport home">
        <img src="assets/mark.png" alt="" /><span>Pixel<span>port</span></span>
      </button>
      <nav>
        <div class="nav-group">
          <h2>WORKSPACE</h2>
          <div id="nav-main"></div>
        </div>
        <div class="nav-group">
          <h2>COLLECTIONS</h2>
          <div id="nav-collections"></div>
        </div>
      </nav>
      <div class="side-bottom">
        <button id="surprise" class="surprise">
          <span class="dice" data-icon="dice-5"></span><span>Surprise me</span
          ><span data-icon="chevron-right"></span>
        </button>
        <div class="profile-line"></div>
        <button class="profile" id="profile">
          <img src="assets/avatar.png" alt="" /><span
            ><strong id="player-name">Player One</strong
            ><small><i></i> Local profile</small></span
          ><span data-icon="settings"></span>
        </button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumbs">
          <button
            id="sidebar-open"
            class="iconbtn small-screen"
            aria-label="Toggle navigation"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            <span data-icon="menu"></span></button
          ><span class="desktop-mark" data-icon="gamepad-2"></span
          ><span>Arcade</span><span class="crumb-slash">/</span
          ><strong id="crumb">Discover</strong>
        </div>
        <div class="top-tools">
          <label class="search"
            ><span data-icon="search"></span
            ><input
              type="search"
              id="search"
              placeholder="Search games..."
              aria-label="Search all games"
            /><kbd>/</kbd></label
          ><button
            class="iconbtn sound"
            id="sound"
            aria-label="Mute sound"
          ></button>
        </div>
      </header>
      <main class="content">
        <p id="library-save-warning" class="save-warning" role="status" hidden></p>
        <section id="hero" aria-label="Featured games"></section>
        <section id="library" tabindex="-1" aria-labelledby="library-title">
          <div class="section-heading">
            <div class="title-count">
              <h1 id="library-title">Game library</h1>
              <span id="game-count"></span>
            </div>
            <div class="views">
              <label class="sort"
                ><span data-icon="arrow-down-wide-narrow"></span
                ><select id="sort" aria-label="Sort games">
                  <option value="featured">Featured</option>
                  <option value="az">Title A–Z</option>
                  <option value="za">Title Z–A</option>
                  <option value="recent">Last played</option></select
                ><span data-icon="chevron-down"></span></label
              ><span class="vline"></span>
              <div class="view-toggle">
                <button id="grid-view" title="Grid view" aria-label="Grid view">
                  <span data-icon="grid-2x2"></span></button
                ><button
                  id="list-view"
                  title="List view"
                  aria-label="List view"
                >
                  <span data-icon="list"></span>
                </button>
              </div>
            </div>
          </div>
          <div
            class="filters"
            id="filters"
            role="group"
            aria-label="Filter by genre"
          ></div>
          <div class="games-grid" id="games"></div>
          <div id="pagination"></div>
        </section>
      </main>
    </div>
    <button id="scrim" aria-label="Close navigation" hidden></button>
    <dialog id="play-dialog" aria-labelledby="playing-title">
      <div class="player-head">
        <div class="player-identity">
          <span id="player-genre-icon"></span>
          <div>
            <div id="playing-genre"></div>
            <h2 id="playing-title"></h2>
          </div>
        </div>
        <div class="player-tools">
          <button id="playing-fav" class="iconbtn"></button
          ><button
            id="expand"
            class="iconbtn"
            aria-label="Expand player"
            title="Expand player"
          >
            <span data-icon="expand"></span></button
          ><button
            id="close-game"
            class="iconbtn"
            aria-label="Return to library"
            title="Return to library"
          >
            <span data-icon="x"></span>
          </button>
        </div>
      </div>
      <div id="stage">
        <div id="pause-layer" hidden>
          <div class="pause-sheet">
            <div class="pause-symbol" id="pause-symbol"></div>
            <h2 id="pause-title"></h2>
            <div id="pause-copy"></div>
            <div class="pause-actions" id="pause-actions"></div>
          </div>
        </div>
      </div>
      <div class="game-footer">
        <button id="how" class="text-button">
          <span data-icon="circle-help"></span>How to play</button
        ><span id="control-hint"></span>
        <div>
          <button id="player-sound" class="iconbtn"></button
          ><button id="pause" class="text-button">
            <span data-icon="pause"></span>Pause <kbd>Esc</kbd>
          </button>
        </div>
      </div>
      <p id="game-save-warning" class="save-warning" role="status" hidden></p>
    </dialog>
    <dialog
      id="settings-dialog"
      class="settings-dialog"
      aria-labelledby="prefs-title"
    >
      <div class="dialog-heading">
        <h2 id="prefs-title">Player settings</h2>
        <button class="iconbtn" id="close-settings" aria-label="Close settings">
          <span data-icon="x"></span>
        </button>
      </div>
      <div class="settings-body">
        <label class="field"
          >Player name<input
            id="name-field"
            maxlength="32"
            autocomplete="off" /></label
        ><button class="pref-sound" id="pref-sound"></button>
        <details id="credits">
          <summary>Game credits &amp; licenses</summary>
          <div id="credits-body"></div>
        </details>
        <button id="save-profile" class="primary">Save settings</button>
      </div>
    </dialog>
    <div id="toast" role="status"></div>
  </body>
</html>
